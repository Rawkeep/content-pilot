[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "content-pilot"
version = "0.1.0"
description = "Content-Pilot — deutsches KI-Content-Studio: Idee rein, plattformgerechte Posts raus, Veröffentlichung über dein self-gehostetes Postiz"
requires-python = ">=3.9"
dependencies = ["pydantic>=2"]

[project.optional-dependencies]
# Lokales LLM via Ollama
ollama = ["httpx>=0.27"]
# Komplette Dev-Toolchain — reproduzierbar via:  pip install -e ".[dev]"
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.8"]

[project.scripts]
contentpilot = "contentpilot.cli:main"

[tool.setuptools]
packages = ["contentpilot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
extend-select = ["I"]

[tool.mypy]
python_version = "3.9"
plugins = ["pydantic.mypy"]
files = ["contentpilot"]
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["httpx", "httpx.*"]
ignore_missing_imports = true
